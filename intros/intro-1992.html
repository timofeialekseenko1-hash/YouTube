<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>1992 Intro</title>
<meta name="description" content="Molten-gold peace-symbol title reveal over a storm-clouded capitol dome — a recreated motion-graphics intro." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Cinzel:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-0:#04050a;
    --bg-1:#0a0d14;
    --gold-hot:#fff4c2;
    --gold-1:#ffd766;
    --gold-2:#ff9d1c;
    --gold-3:#c85e07;
    --glow:#ffb02e;
    --title:#f2e8cf;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:"Cormorant Garamond",Georgia,serif;
    color:#fff;
  }

  /* 16:9 stage that fits any viewport (1080p / 4K ready — everything is vector) */
  #stage{
    position:relative;
    width:100vw;height:56.25vw;         /* 16:9 */
    max-height:100vh;max-width:177.78vh;
    background:#000;
    overflow:hidden;
    box-shadow:0 0 120px rgba(0,0,0,.8);
  }
  #svg{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- CAMERA PUSH-IN ---------- */
  .cam{transform-origin:50% 62%;animation:push 9s cubic-bezier(.25,.6,.3,1) forwards}
  @keyframes push{
    0%   {transform:scale(1.0)}
    100% {transform:scale(1.11)}
  }

  /* ---------- SCENE FADE FROM BLACK ---------- */
  .scene{opacity:0;animation:sceneIn 2.2s ease-out .9s forwards}
  @keyframes sceneIn{from{opacity:0}to{opacity:1}}

  /* ---------- CLOUD DRIFT ---------- */
  .clouds{animation:drift 40s linear infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-480px)}}

  /* warm underlight that swells with the flame */
  .underglow{opacity:0;animation:underglow 6s ease-out 1.6s forwards}
  @keyframes underglow{0%{opacity:0}45%{opacity:.9}100%{opacity:.7}}

  /* ---------- FLAME BEAM (ignition) ---------- */
  .beam{
    transform-box:fill-box;transform-origin:50% 100%;
    opacity:0;transform:scaleY(0);
    animation:beam 1.5s cubic-bezier(.2,.7,.3,1) 1.6s forwards;
  }
  @keyframes beam{
    0%  {opacity:0;transform:scaleY(0)}
    30% {opacity:1;transform:scaleY(1.05)}
    70% {opacity:1;transform:scaleY(1)}
    100%{opacity:0;transform:scaleY(.9)}
  }

  /* ---------- PEACE SYMBOL: rise + grow ---------- */
  .peace{
    transform-box:fill-box;transform-origin:50% 50%;
    opacity:0;
    animation:peaceRise 2.6s cubic-bezier(.22,.68,.24,1) 2.3s forwards;
  }
  @keyframes peaceRise{
    0%   {opacity:0;transform:translateY(150px) scale(.12)}
    25%  {opacity:1}
    100% {opacity:1;transform:translateY(0) scale(1)}
  }
  /* draw-on the strokes as it forms */
  .stroke{
    stroke-dasharray:var(--len);
    stroke-dashoffset:var(--len);
    animation:draw 2.0s ease-out 2.4s forwards;
  }
  @keyframes draw{to{stroke-dashoffset:0}}

  /* molten flicker on the glow */
  .flicker{animation:flicker 2.6s ease-in-out 3s infinite}
  @keyframes flicker{
    0%,100%{opacity:.85}
    20%{opacity:1}
    45%{opacity:.7}
    60%{opacity:.95}
    80%{opacity:.78}
  }

  /* ---------- "1992" TITLE ---------- */
  .title{
    position:absolute;left:0;right:0;top:26.5%;
    text-align:center;
    font-family:"Cormorant Garamond",Georgia,serif;
    font-weight:500;
    font-size:9.2vw;                 /* scales with 16:9 stage width */
    letter-spacing:.16em;
    color:var(--title);
    text-shadow:0 2px 30px rgba(255,170,40,.35),0 0 2px rgba(0,0,0,.6);
    opacity:0;
    transform:scale(1.06);
    animation:titleIn 1.6s cubic-bezier(.2,.7,.3,1) 4.7s forwards,
              titleOut 1.1s ease-in 8.0s forwards;
    text-indent:.16em;               /* balance the trailing letter-spacing */
    will-change:opacity,transform;
    pointer-events:none;
  }
  @keyframes titleIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
  @keyframes titleOut{to{opacity:0}}

  /* film grain + vignette */
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 55%,transparent 42%,rgba(0,0,0,.55) 82%,rgba(0,0,0,.9) 100%)}

  /* letterbox controls */
  #ui{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    display:flex;gap:10px;z-index:20;font-family:system-ui,sans-serif;
    opacity:0;transition:opacity .4s;pointer-events:none}
  #ui.show{opacity:.9;pointer-events:auto}
  #ui:hover{opacity:1}
  #ui button{
    background:rgba(20,20,26,.85);color:#f0e6cf;border:1px solid rgba(255,190,70,.35);
    padding:8px 16px;border-radius:999px;font-size:13px;letter-spacing:.04em;
    cursor:pointer;backdrop-filter:blur(6px)}
  #ui button:hover{border-color:rgba(255,190,70,.8);color:#fff}
  @media (max-width:640px){#ui{opacity:.8}}
</style>
</head>
<body>
  <div id="stage">
    <svg id="svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- night sky gradient -->
        <radialGradient id="sky" cx="50%" cy="70%" r="85%">
          <stop offset="0%"  stop-color="#12161f"/>
          <stop offset="45%" stop-color="#0a0d14"/>
          <stop offset="100%" stop-color="#04050a"/>
        </radialGradient>

        <!-- storm clouds -->
        <filter id="cloudNoise" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="5" seed="7" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="matrix"
            values="0 0 0 0 0.13
                    0 0 0 0 0.15
                    0 0 0 0 0.19
                    0 0 0 -1.15 1.05"/>
        </filter>

        <!-- molten gold gradient -->
        <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="var(--gold-hot)"/>
          <stop offset="35%" stop-color="var(--gold-1)"/>
          <stop offset="70%" stop-color="var(--gold-2)"/>
          <stop offset="100%" stop-color="var(--gold-3)"/>
        </linearGradient>

        <!-- ember texture displacement for the peace symbol -->
        <filter id="ember" x="-40%" y="-40%" width="180%" height="180%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04 0.06" numOctaves="3" seed="21" result="t">
            <animate attributeName="baseFrequency" dur="7s" values="0.04 0.06;0.06 0.045;0.04 0.06" repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
        </filter>

        <!-- big soft glow -->
        <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
          <feGaussianBlur stdDeviation="14" result="b1"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="34" result="b2"/>
          <feMerge>
            <feMergeNode in="b2"/>
            <feMergeNode in="b1"/>
          </feMerge>
        </filter>

        <radialGradient id="warm" cx="50%" cy="100%" r="75%">
          <stop offset="0%"  stop-color="rgba(255,150,40,.55)"/>
          <stop offset="40%" stop-color="rgba(255,120,30,.20)"/>
          <stop offset="100%" stop-color="rgba(255,120,30,0)"/>
        </radialGradient>

        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0b0e15"/>
          <stop offset="100%" stop-color="#04050a"/>
        </linearGradient>
      </defs>

      <!-- ================= SCENE ================= -->
      <g class="cam">
        <g class="scene">
          <!-- sky -->
          <rect x="0" y="0" width="1920" height="1080" fill="url(#sky)"/>
          <!-- drifting storm clouds -->
          <g class="clouds">
            <rect x="-480" y="-40" width="2880" height="760" filter="url(#cloudNoise)" opacity="0.9"/>
          </g>

          <!-- ===== capitol dome silhouette (original stylized) ===== -->
          <g fill="#070a10" stroke="#2b323d" stroke-width="1.2">
            <!-- building body -->
            <rect x="470" y="640" width="980" height="300"/>
            <!-- basement / steps -->
            <rect x="360" y="900" width="1200" height="70" fill="#05070c"/>
            <rect x="300" y="960" width="1320" height="60" fill="#04060a"/>
            <!-- left & right wings -->
            <rect x="300" y="720" width="200" height="220"/>
            <rect x="1420" y="720" width="200" height="220"/>
            <!-- portico pediment -->
            <polygon points="700,640 960,548 1220,640"/>
            <!-- columns (portico) -->
            <g fill="#0a0e15">
              <rect x="742" y="648" width="18" height="252"/>
              <rect x="792" y="648" width="18" height="252"/>
              <rect x="842" y="648" width="18" height="252"/>
              <rect x="892" y="648" width="18" height="252"/>
              <rect x="1000" y="648" width="18" height="252"/>
              <rect x="1050" y="648" width="18" height="252"/>
              <rect x="1100" y="648" width="18" height="252"/>
              <rect x="1150" y="648" width="18" height="252"/>
            </g>
            <!-- dome drum -->
            <rect x="828" y="452" width="264" height="120" rx="6"/>
            <!-- drum colonnade -->
            <g fill="#0a0e15">
              <rect x="846" y="460" width="12" height="112"/>
              <rect x="882" y="460" width="12" height="112"/>
              <rect x="918" y="460" width="12" height="112"/>
              <rect x="954" y="460" width="12" height="112"/>
              <rect x="990" y="460" width="12" height="112"/>
              <rect x="1026" y="460" width="12" height="112"/>
              <rect x="1062" y="460" width="12" height="112"/>
            </g>
            <!-- dome shell -->
            <path d="M828 456 Q960 300 1092 456 Z"/>
            <!-- dome ribs (subtle) -->
            <g stroke="#20262f" stroke-width="1" fill="none">
              <path d="M880 452 Q905 350 960 316"/>
              <path d="M960 452 Q960 360 960 316"/>
              <path d="M1040 452 Q1015 350 960 316"/>
            </g>
            <!-- lantern + finial -->
            <rect x="936" y="286" width="48" height="34" rx="3"/>
            <path d="M936 286 Q960 258 984 286 Z"/>
            <rect x="955" y="240" width="10" height="24"/>
            <circle cx="960" cy="236" r="7"/>
          </g>

          <!-- faint window light glints on the dome -->
          <g fill="rgba(180,200,235,0.06)">
            <rect x="852" y="470" width="8" height="96"/>
            <rect x="1064" y="470" width="8" height="96"/>
          </g>

          <!-- ground / plaza -->
          <rect x="0" y="1000" width="1920" height="80" fill="url(#ground)"/>

          <!-- warm underlight from the flame -->
          <rect class="underglow" x="560" y="560" width="800" height="460" fill="url(#warm)"/>

          <!-- ================= FLAME BEAM ================= -->
          <g class="beam" filter="url(#glow)">
            <path d="M960 1000
                     C 946 900, 946 850, 960 620
                     C 974 850, 974 900, 960 1000 Z"
                  fill="url(#goldGrad)"/>
          </g>

          <!-- ================= PEACE SYMBOL ================= -->
          <!-- glow copy underneath -->
          <g class="peace">
            <g class="flicker" filter="url(#glow)">
              <g fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round">
                <circle cx="960" cy="600" r="150"/>
                <line x1="960" y1="450" x2="960" y2="750"/>
                <line x1="960" y1="600" x2="854" y2="706"/>
                <line x1="960" y1="600" x2="1066" y2="706"/>
              </g>
            </g>
            <!-- crisp molten body with ember displacement + draw-on -->
            <g filter="url(#ember)" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round">
              <circle class="stroke" style="--len:943" cx="960" cy="600" r="150"/>
              <line   class="stroke" style="--len:300" x1="960" y1="450" x2="960" y2="750"/>
              <line   class="stroke" style="--len:150" x1="960" y1="600" x2="854" y2="706"/>
              <line   class="stroke" style="--len:150" x1="960" y1="600" x2="1066" y2="706"/>
            </g>
          </g>
        </g><!-- /scene -->
      </g><!-- /cam -->
    </svg>

    <div class="title">1992</div>
    <div class="vignette"></div>
  </div>

  <div id="ui">
    <button id="replay">↻ Replay</button>
    <button id="loop">Loop: Off</button>
  </div>

<script>
  const stage = document.getElementById('stage');
  const replay = document.getElementById('replay');
  const loopBtn = document.getElementById('loop');
  let looping = false, timer = null;

  function play(){
    // restart all CSS animations by cloning the stage's animated subtree
    const anims = stage.querySelectorAll(
      '.cam,.scene,.clouds,.underglow,.beam,.peace,.stroke,.flicker,.title'
    );
    anims.forEach(el=>{
      el.style.animation='none';
      // force reflow
      void el.offsetWidth;
      el.style.animation='';
    });
  }

  replay.addEventListener('click', play);

  loopBtn.addEventListener('click', ()=>{
    looping = !looping;
    loopBtn.textContent = 'Loop: ' + (looping ? 'On' : 'Off');
    if(looping){ schedule(); } else if(timer){ clearInterval(timer); timer=null; }
  });

  function schedule(){
    if(timer) clearInterval(timer);
    // full intro ≈ 9.5s
    timer = setInterval(()=>{ if(looping) play(); }, 9600);
  }

  // auto-hide controls (clean for screen-recording): show on mouse move, hide after idle
  const ui = document.getElementById('ui');
  let hideT = null;
  function revealUI(){
    ui.classList.add('show');
    clearTimeout(hideT);
    hideT = setTimeout(()=>ui.classList.remove('show'), 2200);
  }
  window.addEventListener('mousemove', revealUI);
  window.addEventListener('touchstart', revealUI, {passive:true});
</script>
</body>
</html>
